<!DOCTYPE html>
<html>
    <head>

    <body>
        <main>
            <div class="header">
                <h2>TaskFlow</h2>

                <div class="menu">
                    <p id="Home"><a href="index.html">Home</a></p>

                    <p id="login"><a href="login.html">Log in</a></p>
                    <p id="sign-up"><a href="registrer.html">Sign up</a></p>
                </div>
            </div>
             <div class="sign-up">
                <h3>Sign up to TaskFlow</h3>
                <div class="form">
                    <form>
                        <label for="user">Username: </label>
                        <input type="text" id="user" name="username" placeholder="Enter your username" required>
                        <label for="email">Email: </label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <label for="pass">Password: </label>
                        <input type="password" id = "pass" name="password" placeholder="Enter your password" required>
                        <label for="confirm">Confirm the password: </label>
                        <input type="password" id="confirm" name="confirmation" placeholder="Confirm the password" required>
                        <button type="submit">Sign up</button>
                    </form>
                </div>
            </div>
            <p><a href="login.html">Have an account? Log in </a></p>
        </main>
        <footer class="footer">
            <h3>TaskFlow</h3>

        </footer>
